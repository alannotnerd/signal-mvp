<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Project Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <a href="index.html" class="back-link">← Back to Projects</a>
  <div id="content"><div style="text-align:center;padding:60px;color:var(--text-dim)">Loading project data...</div></div>
</div>

<script src="js/stubs.js"></script>
<script src="js/components.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'chainx';
  const p = await Stubs.getProject(id);
  if (!p) { document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--red)">Project not found.</div>'; return; }

  const R = Components;
  const statusLabels = { in_review: 'In Review', approved: 'Approved', rejected: 'Rejected', pending: 'Pending' };

  const riskLabel = (r) => {
    const m = { critical: 'CRITICAL', high: 'HIGH', medium: 'MEDIUM', low: 'LOW', info: 'INFO', pending: 'PENDING', good: 'GOOD' };
    return m[r] || r.toUpperCase();
  };
  const riskColor = (r) => {
    const m = { critical: 'var(--red)', high: 'var(--orange)', medium: 'var(--yellow)', low: 'var(--green)', good: 'var(--green)', pending: 'var(--blue)', info: 'var(--text-dim)' };
    return m[r] || 'var(--text-dim)';
  };

  // Build R1 section
  const r1 = p.r1_regulatory;
  const r1Body = `
    <div class="info-grid">
      <div class="info-item"><div class="info-label">Sanctions Screening</div><div class="info-value" style="color:${r1.sanctions.status === 'clean' ? 'var(--green)' : 'var(--red)'}">${r1.sanctions.status === 'clean' ? '✓ Clean — 0 matches' : '🔴 ' + (r1.sanctions.matches ? r1.sanctions.matches.length + ' matches found' : 'Flagged')}</div></div>
      <div class="info-item"><div class="info-label">Legal Opinions</div><div class="info-value">${r1.legal_opinions.opinions.length} submitted${r1.legal_opinions.missing.length ? ' · ' + r1.legal_opinions.missing.length + ' missing' : ''}</div></div>
      <div class="info-item"><div class="info-label">Token Classification</div><div class="info-value">${r1.token_characteristics.privacy_enhancing ? '⚠ Privacy features' : '✓ Standard token'}</div></div>
      <div class="info-item"><div class="info-label">Entity</div><div class="info-value">${r1.entity.name} · ${r1.entity.jurisdiction} <span class="tag tag-self">${r1.entity.verified === 'partially_verified' ? 'partial' : 'self-reported'}</span></div></div>
    </div>
    ${r1.legal_opinions.opinions.length ? `
    <div style="margin-top:12px"><strong style="font-size:12px">Legal Opinions:</strong></div>
    <table style="margin-top:6px"><thead><tr><th>Firm</th><th>Jurisdiction</th><th>Topic</th><th>Date</th><th>Status</th></tr></thead><tbody>
      ${r1.legal_opinions.opinions.map(o => `<tr><td>${o.firm}</td><td>${o.jurisdiction}</td><td>${o.topic}</td><td>${o.date}</td><td><span class="tag tag-verified">✓ Verified</span></td></tr>`).join('')}
    </tbody></table>` : ''}
    ${r1.legal_opinions.missing.length ? `<div style="margin-top:8px;color:var(--orange);font-size:12px">⚠ Missing jurisdictions: ${r1.legal_opinions.missing.join(', ')}</div>` : ''}
    ${r1.sanctions.matches ? `
    <div style="margin-top:12px"><strong style="font-size:12px;color:var(--red)">Sanctions Matches:</strong></div>
    <table style="margin-top:6px"><thead><tr><th>Entity</th><th>List</th><th>Reason</th></tr></thead><tbody>
      ${r1.sanctions.matches.map(m => `<tr><td><code>${m.entity}</code></td><td>${m.list}</td><td>${m.reason} (${m.date})</td></tr>`).join('')}
    </tbody></table>` : ''}
  `;

  // Build R2 section
  const r2 = p.r2_fraud;
  let r2Body = '';
  if (r2.wallet_map) {
    const cats = [
      { key: 'team', label: 'TEAM', data: r2.wallet_map.team },
      { key: 'investors', label: 'INVESTORS', data: r2.wallet_map.investors },
      { key: 'ecosystem', label: 'ECOSYSTEM', data: r2.wallet_map.ecosystem },
      { key: 'treasury', label: 'TREASURY', data: r2.wallet_map.treasury }
    ];

    cats.forEach(cat => {
      if (!cat.data || !cat.data.wallets) return;
      const s = cat.data;
      r2Body += `<div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <strong style="font-size:13px">${cat.label}</strong>
          <span style="font-size:11px;color:var(--text-dim)">${s.total} wallets · ${s.verified || 0} verified · ${(s.misattributed||0) + (s.sanctioned||0) + (s.sybil||0)} flagged</span>
        </div>
        <table class="wallet-table"><thead><tr><th>Address</th><th>Label</th><th>Entity</th><th>Freshness</th><th>Risk</th></tr></thead><tbody>
          ${s.wallets.map(R.walletRow).join('')}
        </tbody></table>
      </div>`;
    });
  }
  if (r2.sybil_clusters && r2.sybil_clusters.length) {
    r2Body += `<div style="margin-top:12px"><strong style="font-size:12px;color:var(--red)">Sybil Clusters:</strong></div>`;
    r2.sybil_clusters.forEach(c => {
      r2Body += `<div class="flag-card flag-card-critical" style="margin-top:8px">
        <div class="flag-card-header"><span class="dot dot-red"></span><span class="flag-card-title">Cluster: ${c.size} wallets</span></div>
        <div class="flag-card-detail">
          Created: ${c.created} · Funded from: ${c.funding_source}<br>
          Pattern: ${c.pattern}<br>
          Declared as: ${c.declared_as.join(', ')}
        </div>
        <div class="flag-card-action flag-card-action-critical">→ ${c.severity === 'critical' ? 'REJECT or require complete re-disclosure' : 'Investigate'}</div>
      </div>`;
    });
  }
  if (r2.contract_analysis) {
    const ca = r2.contract_analysis;
    r2Body += `<div style="margin-top:16px"><strong style="font-size:13px">Smart Contract</strong></div>
    <div class="info-grid" style="margin-top:8px">
      <div class="info-item"><div class="info-label">Deployment</div><div class="info-value">${ca.deployed ? '✓ Deployed on ' + ca.chain : '⚠ Not deployed'}</div></div>
      <div class="info-item"><div class="info-label">Proxy</div><div class="info-value">${ca.proxy.type} — upgrade: ${ca.proxy.upgrade_control} <span class="tag ${ca.proxy.risk === 'high' ? 'tag-flagged' : 'tag-verified'}">${ca.proxy.risk}</span></div></div>
      <div class="info-item"><div class="info-label">Mint</div><div class="info-value">${ca.mint.cap} · access: ${ca.mint.access} <span class="tag ${ca.mint.risk === 'critical' ? 'tag-flagged' : 'tag-verified'}">${ca.mint.risk}</span></div></div>
      <div class="info-item"><div class="info-label">Audit</div><div class="info-value">${ca.audit.exists ? `✓ ${ca.audit.auditor} (${ca.audit.date}) · ${ca.audit.findings}` : '🔴 None submitted'}</div></div>
    </div>`;
  }

  // Build R3 section
  const r3 = p.r3_integrity;
  const r3Body = `
    <div class="note-dim">⚠ TGE前大部分声明不可验证。仅基于自述数据+合约分析。</div>
    <div style="margin-bottom:16px"><strong style="font-size:13px">解锁计划</strong></div>
    <table><thead><tr><th>类别</th><th>悬崖期</th><th>解锁期</th><th>解锁方式</th><th>首次解锁</th></tr></thead><tbody>
      ${r3.vesting.categories.map(c => `<tr><td>${c.name}</td><td>${c.cliff_months ? c.cliff_months + '个月' : '—'}</td><td>${c.vesting_months ? c.vesting_months + '个月' : '—'}</td><td>${c.schedule}</td><td>${c.first_unlock || '—'}</td></tr>`).join('')}
    </tbody></table>
    ${r3.vesting.contract_deployed ? '<div style="margin-top:8px"><span class="tag tag-verified">✓ Vesting contract deployed</span></div>' : '<div style="margin-top:8px;color:var(--orange)">⚠ 解锁合约尚未部署 — 无法验证执行</div>'}

    <div style="margin-top:16px"><strong style="font-size:13px">集中度</strong></div>
    <div class="gauge"><span style="font-size:11px;width:80px;color:var(--text-dim)">Gini</span><div class="gauge-bar"><div class="gauge-fill" style="width:${r3.concentration.gini * 100}%;background:${r3.concentration.gini > 0.85 ? 'var(--red)' : r3.concentration.gini > 0.75 ? 'var(--orange)' : 'var(--green)'}"></div></div><span class="gauge-value">${(r3.concentration.gini * 100).toFixed(0)}</span><span class="gauge-benchmark">bench ${r3.concentration.gini_benchmark * 100}</span></div>
    <div class="gauge"><span style="font-size:11px;width:80px;color:var(--text-dim)">前3</span><div class="gauge-bar"><div class="gauge-fill" style="width:${r3.concentration.top3_pct}%;background:${r3.concentration.top3_pct > 60 ? 'var(--red)' : r3.concentration.top3_pct > 45 ? 'var(--orange)' : 'var(--green)'}"></div></div><span class="gauge-value">${r3.concentration.top3_pct}%</span><span class="gauge-benchmark">&lt;${r3.concentration.top3_benchmark}%</span></div>
    <div class="gauge"><span style="font-size:11px;width:80px;color:var(--text-dim)">最大单一</span><div class="gauge-bar"><div class="gauge-fill" style="width:${r3.concentration.largest_single_pct}%;background:${r3.concentration.largest_single_pct > 30 ? 'var(--red)' : r3.concentration.largest_single_pct > 25 ? 'var(--orange)' : 'var(--green)'}"></div></div><span class="gauge-value">${r3.concentration.largest_single_pct}%</span><span class="gauge-benchmark">&lt;${r3.concentration.largest_single_benchmark}%</span></div>

    <div style="margin-top:16px"><strong style="font-size:13px">供应控制（链上已验证）</strong></div>
    <div class="info-grid" style="margin-top:8px">
      <div class="info-item"><div class="info-label">销毁</div><div class="info-value">${r3.supply_controls.burn.rate} per tx <span class="tag tag-verified">✓</span></div></div>
      <div class="info-item"><div class="info-label">通胀</div><div class="info-value">${r3.supply_controls.inflation.rate} annual · ${r3.supply_controls.inflation.mechanism} <span class="tag tag-verified">✓</span></div></div>
      <div class="info-item"><div class="info-label">铸币</div><div class="info-value">${r3.supply_controls.mint.cap} · ${r3.supply_controls.mint.access} <span class="tag ${r3.supply_controls.mint.risk === 'low' ? 'tag-verified' : 'tag-flagged'}">${r3.supply_controls.mint.risk}</span></div></div>
    </div>

    <div style="margin-top:16px"><strong style="font-size:13px">解锁日历</strong></div>
    ${r3.unlock_calendar.map(e => `
      <div class="unlock-event">
        <span class="unlock-date">${e.date}</span>
        <div class="unlock-bar-wrap"><div class="unlock-bar-fill" style="width:${parseFloat(e.pct) * 3}%">${e.tokens} (${e.pct})</div></div>
        <span class="unlock-info">${e.category}</span>
      </div>
    `).join('')}
    <div style="margin-top:8px"><span class="tag tag-self">◯ 所有解锁数据为自述</span></div>
  `;

  // Build R4 section
  const r4 = p.r4_viability;
  const r4Body = `
    <div class="note-dim">◯ 本节大部分声明不可验证或依赖自述数据。供交易所自身分析参考。</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">产品</div><div class="info-value">${r4.product.url_reachable ? '✓ ' + r4.product.url : '⚠ URL unreachable'} · Status: ${r4.product.status}</div></div>
      <div class="info-item"><div class="info-label">GitHub</div><div class="info-value">${r4.github.stars} ⭐ · ${r4.github.contributors} contributors · ${r4.github.commits_90d} commits (90d) · ${r4.github.status === 'active' ? '✓ Active' : '⚠ Inactive'}</div></div>
      <div class="info-item"><div class="info-label">Team</div><div class="info-value">${r4.team.headcount} total (${r4.team.engineering} eng, ${r4.team.operations} ops, ${r4.team.marketing} mktg) <span class="tag tag-self">self-reported</span></div></div>
      <div class="info-item"><div class="info-label">Financials</div><div class="info-value">Raised: ${r4.financials.total_raised} · Burn: ${r4.financials.burn_rate} · Runway: ${r4.financials.runway_months}mo <span class="tag tag-self">self-reported</span></div></div>
      <div class="info-item"><div class="info-label">Treasury (on-chain)</div><div class="info-value">${r4.financials.treasury_onchain} <span class="tag tag-verified">✓ verified</span></div></div>
    </div>
    ${r4.roadmap ? `
    <div style="margin-top:12px"><strong style="font-size:12px">路线图（自述）</strong></div>
    <table style="margin-top:6px"><thead><tr><th>Milestone</th><th>Target</th><th>Actual</th><th>Status</th></tr></thead><tbody>
      ${r4.roadmap.map(m => `<tr><td>${m.title}</td><td>${m.target}</td><td>${m.actual || '—'}</td><td><span class="tag ${m.status === 'completed' ? 'tag-verified' : ''}">${m.status}</span></td></tr>`).join('')}
    </tbody></table>` : ''}
    ${r4.partnerships ? `
    <div style="margin-top:12px"><strong style="font-size:12px">合作伙伴（自述）</strong></div>
    <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">${r4.partnerships.map(pr => `<span class="tag">${pr.name} (${pr.type})</span>`).join('')}</div>` : ''}
  `;

  // Build R5 section
  const r5 = p.r5_economics;
  const r5Body = `
    <div class="note-dim">◯ 本节供交易所商业分析使用。Signal验证事实性声明，预测和计划为自述。</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">CEX Listings</div><div class="info-value">${r5.market_presence.cex_listings.length ? r5.market_presence.cex_listings.map(l => `✓ ${l.exchange} (${l.pair})`).join('<br>') : 'None (pre-launch)'}</div></div>
      <div class="info-item"><div class="info-label">DEX Listings</div><div class="info-value">${r5.market_presence.dex_listings.length ? r5.market_presence.dex_listings.map(l => `✓ ${l.dex} ${l.pair} · TVL ${l.tvl}`).join('<br>') : 'None'}</div></div>
      ${r5.market_presence.cmc_rank ? `<div class="info-item"><div class="info-label">Market Data</div><div class="info-value">CMC #${r5.market_presence.cmc_rank} · MCap ${r5.market_presence.market_cap} · FDV ${r5.market_presence.fdv} · Vol ${r5.market_presence.daily_volume}</div></div>` : ''}
      <div class="info-item"><div class="info-label">Market Makers</div><div class="info-value">${r5.market_makers.map(m => `${m.wallet_verified ? '✓' : '◯'} ${m.name}`).join('<br>')}</div></div>
      <div class="info-item"><div class="info-label">Community</div><div class="info-value">Twitter ${r5.community.twitter.followers.toLocaleString()} · Discord ${r5.community.discord.members.toLocaleString()} · TG ${r5.community.telegram.members.toLocaleString()}</div></div>
      <div class="info-item"><div class="info-label">Listing Preferences</div><div class="info-value">${r5.listing_preferences.program} · FDV ${r5.listing_preferences.target_fdv} · ${r5.listing_preferences.target_date}</div></div>
    </div>
  `;

  // Assemble full page
  document.getElementById('content').innerHTML = `
    <div class="project-header">
      <div class="project-title">
        <h2>${p.name} (${p.symbol})</h2>
        <div class="meta">
          <span>${p.category}</span>
          <span>·</span>
          <span>Intake v${p.version} · ${p.submitted_at.split('T')[0]}</span>
          <span>·</span>
          <span class="status-${p.status === 'approved' ? 'approved' : p.status === 'in_review' ? 'review' : 'pending'}">${statusLabels[p.status] || p.status}</span>
        </div>
      </div>
      <div class="project-actions">
        <button class="btn btn-danger btn-sm">Reject</button>
        <button class="btn btn-sm">Request Info</button>
        <button class="btn btn-primary btn-sm">Approve</button>
        <button class="btn btn-sm">Export PDF</button>
      </div>
    </div>

    <div class="risk-bar">${R.riskBar(p.risk)}</div>

    <div class="flags-section">
      <h3 style="font-size:14px;margin-bottom:10px;color:var(--text-bright)">⚠ ${p.flags.length} flags · ${p.critical_flags} critical · ${p.high_flags} high · ${p.medium_flags} medium</h3>
      ${p.flags.map(R.flagCard).join('')}
    </div>

    <div class="section">
      <div class="section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <div class="section-header-left"><h3>R1 — 监管风险</h3>${R.riskBadge(r1.risk)}</div><span style="color:var(--text-dim)">▼</span>
      </div>
      <div class="section-body">${r1Body}</div>
    </div>

    <div class="section">
      <div class="section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <div class="section-header-left"><h3>R2 — 欺诈检测</h3>${R.riskBadge(r2.risk)}</div><span style="color:var(--text-dim)">▼</span>
      </div>
      <div class="section-body">${r2Body}</div>
    </div>

    <div class="section">
      <div class="section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <div class="section-header-left"><h3>R3 — 市场诚信</h3>${R.riskBadge(r3.risk)}</div><span style="color:var(--text-dim)">▼</span>
      </div>
      <div class="section-body">${r3Body}</div>
    </div>

    <div class="section">
      <div class="section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <div class="section-header-left"><h3>R4 — 商业可持续性</h3>${R.riskBadge(r4.risk)}</div><span style="color:var(--text-dim)">▼</span>
      </div>
      <div class="section-body">${r4Body}</div>
    </div>

    <div class="section">
      <div class="section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <div class="section-header-left"><h3>R5 — 上币经济学</h3>${R.riskBadge(r5.risk)}</div><span style="color:var(--text-dim)">▼</span>
      </div>
      <div class="section-body">${r5Body}</div>
    </div>
  `;
})();
</script>
</body>
</html>
